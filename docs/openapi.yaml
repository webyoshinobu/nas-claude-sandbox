openapi: 3.0.3
info:
  title: Photo EC Portfolio API
  description: 写真販売ECサイト(ポートフォリオ)のAPI仕様
  version: 1.0.0
servers:
  - url: http://localhost:8080
    description: Local development server

tags:
  - name: Auth
    description: 認証・会員機能
  - name: Photos
    description: 商品(写真)関連
  - name: Cart
    description: カート
  - name: Orders
    description: 注文・決済
  - name: Downloads
    description: ダウンロード
  - name: Seller
    description: 出品者ダッシュボード

paths:
  /api/auth/register:
    post:
      tags: [Auth]
      summary: 会員登録
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, role]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  format: password
                role:
                  type: string
                  enum: [GENERAL, SELLER]
      responses:
        '201':
          description: 登録成功
        '400':
          description: バリデーションエラー

  /api/auth/login:
    post:
      tags: [Auth]
      summary: ログイン
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                password:
                  type: string
      responses:
        '200':
          description: ログイン成功、JWTを返却
          content:
            application/json:
              schema:
                type: object
                properties:
                  accessToken:
                    type: string
                  refreshToken:
                    type: string
        '401':
          description: 認証失敗

  /api/auth/refresh:
    post:
      tags: [Auth]
      summary: トークンリフレッシュ
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                refreshToken:
                  type: string
      responses:
        '200':
          description: 新しいアクセストークンを返却

  /api/users/me:
    get:
      tags: [Auth]
      summary: 自分のユーザー情報取得
      security:
        - bearerAuth: []
      responses:
        '200':
          description: ユーザー情報
    put:
      tags: [Auth]
      summary: 自分のユーザー情報更新
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 更新成功
    delete:
      tags: [Auth]
      summary: 退会(is_activeをfalseに)
      security:
        - bearerAuth: []
      responses:
        '204':
          description: 退会成功

  /api/photos:
    get:
      tags: [Photos]
      summary: 商品一覧取得(検索・カテゴリ絞り込み対応)
      parameters:
        - name: category
          in: query
          schema:
            type: string
        - name: keyword
          in: query
          description: タイトルのあいまい検索(将来対応)
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
        - name: size
          in: query
          schema:
            type: integer
      responses:
        '200':
          description: 商品一覧
    post:
      tags: [Photos]
      summary: 商品登録(ウォーターマーク処理含む)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                title:
                  type: string
                price:
                  type: integer
                  description: 最小通貨単位(セント)
                category:
                  type: string
                image:
                  type: string
                  format: binary
      responses:
        '201':
          description: 登録成功
        '403':
          description: 出品者権限がない

  /api/photos/{id}:
    get:
      tags: [Photos]
      summary: 商品詳細取得
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: 商品詳細
        '404':
          description: 見つからない
    put:
      tags: [Photos]
      summary: 商品編集(自分の出品物のみ)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: 更新成功
        '403':
          description: 自分の出品物ではない
    delete:
      tags: [Photos]
      summary: 商品削除(論理削除)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: 削除成功

  /api/cart:
    get:
      tags: [Cart]
      summary: カート内容取得
      security:
        - bearerAuth: []
      responses:
        '200':
          description: カート内容

  /api/cart/items:
    post:
      tags: [Cart]
      summary: カートに写真を追加
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                photoId:
                  type: integer
      responses:
        '201':
          description: 追加成功
        '409':
          description: 既にカートに追加済み

  /api/cart/items/{photoId}:
    delete:
      tags: [Cart]
      summary: カートから写真を削除
      security:
        - bearerAuth: []
      parameters:
        - name: photoId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: 削除成功

  /api/orders:
    post:
      tags: [Orders]
      summary: 注文作成(カート内容から、status=PENDING)
      security:
        - bearerAuth: []
      responses:
        '201':
          description: 注文作成成功
    get:
      tags: [Orders]
      summary: 自分の注文履歴一覧
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 注文履歴

  /api/orders/{id}:
    get:
      tags: [Orders]
      summary: 注文詳細
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: 注文詳細

  /api/orders/{id}/payment-intent:
    post:
      tags: [Orders]
      summary: Stripe PaymentIntent作成
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: クライアントシークレットを返却
          content:
            application/json:
              schema:
                type: object
                properties:
                  clientSecret:
                    type: string

  /api/webhooks/stripe:
    post:
      tags: [Orders]
      summary: Stripe Webhook受信(決済結果反映)
      description: Stripe署名検証(Signing Secret)により正当性を確認。JWT認証は使用しない
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: 受信成功

  /api/downloads/{token}:
    get:
      tags: [Downloads]
      summary: 署名付きトークンによる高解像度画像DL
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 画像データ
        '410':
          description: トークン期限切れ

  /api/seller/photos:
    get:
      tags: [Seller]
      summary: 自分が出品した写真一覧
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 出品写真一覧

  /api/seller/sales:
    get:
      tags: [Seller]
      summary: 売上集計
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 売上サマリー

  /api/seller/orders:
    get:
      tags: [Seller]
      summary: 自分の写真が購入された注文一覧
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 注文一覧

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
